name: Check the Archive Node API schema copy

# static/archive-node-api/schema.graphql is a copy of schema.graphql from the
# o1-labs/Archive-Node-API repository at the release tag ARCHIVE_NODE_API_REF.
# schema.json and the reference pages under
# docs/node-operators/data-and-history/archive-node-api/reference are
# generated from it. This job fails when the copy no longer matches the tag,
# or when the derived files are stale.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'static/archive-node-api/**'
      - 'docs/node-operators/data-and-history/archive-node-api/reference/**'
      - 'scripts/generate-archive-schema-json.mjs'
      - 'scripts/generate-graphql-reference.mjs'
      - 'docusaurus.config.js'
      - '.github/workflows/check-archive-schema.yml'
  schedule:
    # Mondays 06:00 UTC, so an upstream schema release is noticed within a week.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

env:
  # The Archive Node API release tag the docs copy follows. Move it when a
  # release changes the schema, copy the tag's schema.graphql between the
  # docs:start/docs:end markers, run `npm run generate-graphql-reference --
  # archive` and commit the result. The archive-node-api and
  # archive-node-api-schema pages name the same version in prose; update them
  # in the same change.
  ARCHIVE_NODE_API_REF: v2.1.1

jobs:
  check-archive-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch the schema at the pinned release
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/o1-labs/Archive-Node-API/${ARCHIVE_NODE_API_REF}/schema.graphql" \
            -o /tmp/upstream.graphql

      - name: Compare the SDL copy with the pinned release
        run: |
          # The copy wraps the upstream file in a header and #include_code markers.
          sed -n '/^# docs:start schema$/,/^# docs:end schema$/p' static/archive-node-api/schema.graphql \
            | sed '1d;$d' > /tmp/local.graphql
          if ! diff -u /tmp/upstream.graphql /tmp/local.graphql; then
            echo ""
            echo "❌ static/archive-node-api/schema.graphql differs from Archive-Node-API@${ARCHIVE_NODE_API_REF}."
            echo "Copy the upstream schema.graphql between the docs:start/docs:end markers,"
            echo "then run 'npm run generate-graphql-reference -- archive' and commit the result."
            exit 1
          fi

      - name: Regenerate schema.json and the reference pages
        run: npm run generate-graphql-reference -- archive

      - name: Check the generated files for differences
        run: |
          REFERENCE=docs/node-operators/data-and-history/archive-node-api/reference
          if ! git diff --exit-code --stat static/archive-node-api/schema.json "$REFERENCE"; then
            echo ""
            echo "❌ The generated Archive Node API files are out of date."
            echo "Run 'npm run generate-graphql-reference -- archive' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain "$REFERENCE")" ]; then
            git status --porcelain "$REFERENCE"
            echo ""
            echo "❌ The generator produced pages that are not committed. Commit them."
            exit 1
          fi

      - name: Report a newer Archive Node API release
        # Informational: the newest tag may be ahead of ARCHIVE_NODE_API_REF.
        # The schema of a newer release may be identical; the diff above is
        # what decides whether the docs are stale.
        run: |
          LATEST=$(git ls-remote --tags --refs https://github.com/o1-labs/Archive-Node-API.git 'v*' \
            | awk -F/ '{print $NF}' | sort -V | tail -n 1)
          echo "Pinned: ${ARCHIVE_NODE_API_REF}; newest tag: ${LATEST}"
          if [ "$LATEST" != "$ARCHIVE_NODE_API_REF" ]; then
            echo "::notice::o1-labs/Archive-Node-API newest tag is ${LATEST}; the docs schema copy is pinned to ${ARCHIVE_NODE_API_REF}. Compare the two schemas and move ARCHIVE_NODE_API_REF if they differ."
          fi
