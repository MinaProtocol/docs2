name: Check llms-full.txt is up to date

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**/*.mdx'
      - 'docs/**/*.md'
      - 'scripts/generate-llms-txt.mjs'
      - 'scripts/include-code.cjs'
      - 'scripts/include-code.test.mjs'
      - 'scripts/mdx-to-markdown.cjs'
      - 'scripts/markdown-twin-path.cjs'
      - 'scripts/markdown-twins.test.mjs'
      - 'plugins/markdown-twins.cjs'
      # Pages include code regions from the examples with #include_code, so an
      # example change can change llms-full.txt.
      - 'examples/**'
      - 'static/llms-full.txt'
  workflow_dispatch: {}

jobs:
  check-llms-txt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The markdown twin tests load the Docusaurus docs plugin to compute
      # real routes.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test the #include_code resolver and the markdown twins
        run: npm run test:scripts

      - name: Regenerate llms-full.txt
        run: node scripts/generate-llms-txt.mjs

      - name: Check for differences
        run: |
          if ! git diff --exit-code static/llms-full.txt; then
            echo ""
            echo "❌ static/llms-full.txt is out of date!"
            echo "Run 'npm run generate-llms-txt' and commit the result."
            exit 1
          fi
